<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>503 – Seite nicht gefunden | Jan Amrhein</title>
    <link rel="stylesheet" href="src/style.css" />
  </head>
  <body>
    <main class="grid min-h-screen place-items-center bg-base-200 p-6 text-base-content">
      <section class="card w-full max-w-xl bg-base-100 shadow-xl">
        <div class="card-body items-center text-center">
          <h1 class="text-6xl font-extrabold sm:text-8xl text-red-500">503</h1>
          <h2 class="text-2xl font-bold sm:text-3xl">Service unavailable</h2>
          <p class="px-8">Oops! Der Server ist momentan nicht erreichbar. Bitte versuche es später nochmals oder kontaktiere den Server Admin.</p>
          <img
            src="src/assets/error.gif"
            alt="Animiertes Fehlerbild"
            class="mt-4 max-h-80 max-w-full rounded-box object-contain"
          />
          <a href="https://janamrhein.ch/" class="btn btn-primary">Zur Homepage</a>
        </div>
      </section>
    </main>
  </body>
</html>
